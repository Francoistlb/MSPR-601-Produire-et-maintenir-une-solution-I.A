services:
  frontend:
    build:
      context: ./frontend
      args:
        COUNTRY: ${COUNTRY:-usa}
    expose:
      - "80"
    depends_on:
      - backend
    environment:
      - COUNTRY=${COUNTRY:-usa}
      - REACT_APP_API_URL=/api
      - REACT_APP_DATAVIZ_ENABLED=${ENABLE_DATAVIZ:-true}
      - REACT_APP_TECHNICAL_API_ENABLED=${ENABLE_TECHNICAL_API:-true}
      - REACT_APP_MULTI_LANGUAGE=${MULTI_LANGUAGE:-false}
      - REACT_APP_SUPPORTED_LANGUAGES=${SUPPORTED_LANGUAGES:-en}
      - REACT_APP_RGPD_MODE=${RGPD_COMPLIANCE:-false}
    networks:
      - default
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    expose:
      - "8000"
    depends_on:
      db:
        condition: service_healthy
    environment:
      - TZ=UTC
      - COUNTRY=${COUNTRY:-usa}
      - ENV=${ENV:-production}
      - DATABASE_URL=${DATABASE_URL}
      - SECRET_KEY=${SECRET_KEY}
      - ALGORITHM=${ALGORITHM}
      - ACCESS_TOKEN_EXPIRE_MINUTES=${ACCESS_TOKEN_EXPIRE_MINUTES}
      - COVID_DATA_URL=${COVID_DATA_URL}
      - MPOX_KAGGLE_DATASET=${MPOX_KAGGLE_DATASET}
      - ENABLE_TECHNICAL_API=${ENABLE_TECHNICAL_API:-true}
      - ENABLE_DATAVIZ=${ENABLE_DATAVIZ:-true}
      - RGPD_COMPLIANCE=${RGPD_COMPLIANCE:-false}
      - MULTI_LANGUAGE=${MULTI_LANGUAGE:-false}
      - SUPPORTED_LANGUAGES=${SUPPORTED_LANGUAGES:-en}
      - DATA_RETENTION_DAYS=${DATA_RETENTION_DAYS:-2555}
    volumes:
      - ./backend:/app 
    networks:
      - default
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  nginx:
    image: nginx:latest
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - backend
    networks:
      - default
    restart: unless-stopped

  pgadmin:
    image: dpage/pgadmin4
    expose:
      - "80"
    environment:
      - TZ=UTC
      - PGADMIN_DEFAULT_EMAIL=${PGADMIN_DEFAULT_EMAIL}
      - PGADMIN_DEFAULT_PASSWORD=${PGADMIN_DEFAULT_PASSWORD}
    volumes:
      - pgadmin-data:/var/lib/pgadmin
    depends_on:
      - db
    networks:
      - default
    restart: unless-stopped
    profiles:
      - pgadmin

  db:
    image: postgres:14
    ports:
      - "5434:5432"
    environment:
      - TZ=UTC
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - default
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

volumes:
  postgres-data:
  pgadmin-data:

networks:
  default:
    driver: bridge
