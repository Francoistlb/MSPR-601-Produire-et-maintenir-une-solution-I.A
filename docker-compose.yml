services:
  frontend:
    build:
      context: ./frontend
    expose:
      - "80"
    depends_on:
      - backend
    networks:
      - default
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    expose:
      - "8000"
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env.docker
    environment:
      - TZ=UTC
    volumes:
      - ./backend:/app 
      - ./backups:/app/backups
    networks:
      - default
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  nginx:
    image: nginx:latest
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - backend
      - pgadmin
    networks:
      - default
    restart: unless-stopped

  pgadmin:
    image: dpage/pgadmin4
    expose:
      - "80"
    env_file:
      - .env.docker
    environment:
      - TZ=UTC
    volumes:
      - pgadmin-data:/var/lib/pgadmin
    depends_on:
      - db
    networks:
      - default
    restart: unless-stopped

  db:
    image: postgres:14
    ports:
      - "5434:5432"
    env_file:
      - .env.docker
    environment:
      - TZ=UTC
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - default
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

volumes:
  postgres-data:
  pgadmin-data:
  backup-data:

networks:
  default:
    driver: bridge
