services:
  frontend:
    build:
      context: ./frontend
      args:
        COUNTRY: ${COUNTRY}
    expose:
      - "80"
    depends_on:
      - backend
    environment:
      - COUNTRY=${COUNTRY}
      - VITE_COUNTRY=${COUNTRY}
      - VITE_API_URL=/api
      - VITE_ENV=${ENV}

    networks:
      - default
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    expose:
      - "8000"
    depends_on:
      db:
        condition: service_healthy
    environment:
      # Variables essentielles
      - TZ=UTC
      - COUNTRY=${COUNTRY}  # Seule variable nécessaire pour la configuration pays
      - ENV=${ENV}

      # Configuration de sécurité
      - SECRET_KEY=${SECRET_KEY}
      - ALGORITHM=${ALGORITHM}
      - ACCESS_TOKEN_EXPIRE_MINUTES=${ACCESS_TOKEN_EXPIRE_MINUTES}

      # Configuration base de données
      - DATABASE_URL=${DATABASE_URL}

      # URLs des données
      - COVID_DATA_URL=${COVID_DATA_URL}
      - MPOX_KAGGLE_DATASET=${MPOX_KAGGLE_DATASET}

    volumes:
      - ./backend:/app 
      - ./backups:/app/backups
    networks:
      - default
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  nginx:
    image: nginx:latest
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - backend
    networks:
      - default
    restart: unless-stopped

  pgadmin:
    image: dpage/pgadmin4
    expose:
      - "80"
    environment:
      - TZ=UTC
      - PGADMIN_DEFAULT_EMAIL=${PGADMIN_DEFAULT_EMAIL}
      - PGADMIN_DEFAULT_PASSWORD=${PGADMIN_DEFAULT_PASSWORD}
    volumes:
      - pgadmin-data:/var/lib/pgadmin
    depends_on:
      - db
    networks:
      - default
    restart: unless-stopped
    profiles:
      - pgadmin

  db:
    image: postgres:14
    ports:
      - "5434:5432"
    environment:
      - TZ=UTC
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - default
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

volumes:
  postgres-data:
  pgadmin-data:
  backup-data:

networks:
  default:
    driver: bridge
