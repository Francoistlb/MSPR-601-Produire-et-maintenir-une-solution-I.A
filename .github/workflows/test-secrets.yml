name: Test Secrets Configuration
on:
  pull_request:
    branches:
      - develop
      - main
  push:
    branches:
      - develop
      - main

jobs:
  test-secrets:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:14
        ENV_MSPR:
          POSTGRES_USER: ${{ fromJson(secrets.ENV_MSPR).POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ fromJson(secrets.ENV_MSPR).POSTGRES_PASSWORD }}
          POSTGRES_DB: ${{ fromJson(secrets.ENV_MSPR).POSTGRES_DB }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Check Secrets Presence
        run: |
          if [ ! -z "${{ fromJson(secrets.ENV_MSPR).API_URL }}" ]; then
            echo "✓ API_URL is set"
          else
            echo "✗ API_URL is missing"
          fi
          if [ ! -z "${{ fromJson(secrets.ENV_MSPR).DATABASE_URL_TEST }}" ]; then
            echo "✓ DATABASE_URL_TEST is set"
          else
            echo "✗ DATABASE_URL_TEST is missing"
          fi
          if [ ! -z "${{ fromJson(secrets.ENV_MSPR).POSTGRES_USER }}" ]; then
            echo "✓ POSTGRES_USER is set"
          else
            echo "✗ POSTGRES_USER is missing"
          fi
          if [ ! -z "${{ fromJson(secrets.ENV_MSPR).POSTGRES_PASSWORD }}" ]; then
            echo "✓ POSTGRES_PASSWORD is set"
          else
            echo "✗ POSTGRES_PASSWORD is missing"
          fi
          if [ ! -z "${{ fromJson(secrets.ENV_MSPR).POSTGRES_DB }}" ]; then
            echo "✓ POSTGRES_DB is set"
          else
            echo "✗ POSTGRES_DB is missing"
          fi
          if [ ! -z "${{ fromJson(secrets.ENV_MSPR).SECRET_KEY }}" ]; then
            echo "✓ SECRET_KEY is set"
          else
            echo "✗ SECRET_KEY is missing"
          fi
          if [ ! -z "${{ fromJson(secrets.ENV_MSPR).ALGORITHM }}" ]; then
            echo "✓ ALGORITHM is set"
          else
            echo "✗ ALGORITHM is missing"
          fi

      - name: Test Database Connection
        ENV_MSPR:
          POSTGRES_USER: ${{ fromJson(secrets.ENV_MSPR).POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ fromJson(secrets.ENV_MSPR).POSTGRES_PASSWORD }}
          POSTGRES_DB: ${{ fromJson(secrets.ENV_MSPR).POSTGRES_DB }}
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
          export PGPASSWORD=$POSTGRES_PASSWORD
          psql -h localhost -p 5432 -U $POSTGRES_USER -d $POSTGRES_DB -c "\l" || exit 1

      - name: Verify All Secrets Present
        run: |
          missing_secrets=0
          for secret in API_URL DATABASE_URL_TEST POSTGRES_USER POSTGRES_PASSWORD POSTGRES_DB SECRET_KEY ALGORITHM ACCESS_TOKEN_EXPIRE_MINUTES
          do
            value=$(echo '${{ toJSON(fromJson(secrets.ENV_MSPR)) }}' | jq -r ".$secret")
            if [ -z "$value" ]; then
              echo "❌ $secret is missing"
              missing_secrets=$((missing_secrets + 1))
            fi
          done
          if [ $missing_secrets -gt 0 ]; then
            echo "❌ $missing_secrets secrets are missing"
            exit 1
          else
            echo "✅ All secrets are present"
          fi

      - name: Final Status
        run: |
          echo "🎉 All tests completed successfully!"