name: CI – Lint • Tests • E2E

# Déclenché sur push et pull request
on:
  push:       { branches: [main, develop] }
  pull_request:
    branches: [main, develop]

jobs:
  quality-test-e2e:
    runs-on: ubuntu-latest

    # Service PostgreSQL pour les tests
    services:
      postgres:
        image: postgres:14
        env:
          POSTGRES_USER:     ${{ fromJson(secrets.ENV_MSPR).POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ fromJson(secrets.ENV_MSPR).POSTGRES_PASSWORD }}
          POSTGRES_DB:       ${{ fromJson(secrets.ENV_MSPR).POSTGRES_DB }}
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s --health-timeout 5s --health-retries 5

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    # Configuration Python
    - name: Set up Python
      uses: actions/setup-python@v4
      with: { python-version: "3.12" }

    - name: Install Python deps (test & lint)
      run: |
        python -m pip install --upgrade pip
        pip install -r backend/requirements.txt
        pip install flake8 black pytest safety  # Ajout de safety pour vérifier les dépendances

    # Configuration Node.js
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: "20"
        cache: "npm"
        cache-dependency-path: frontend/package-lock.json

    # Analyse du code Python
    - name: Python Lint & Format
      run: |
        echo "🐍 Analyse du code Python..."
        flake8 backend/
        black --check backend/

    # Analyse du code JavaScript/React
    - name: Install JS deps
      working-directory: frontend
      run: |
        echo "📦 Installation des dépendances JS..."
        npm ci

    - name: Lint JS
      working-directory: frontend
      run: |
        echo "🔍 Analyse du code JS..."
        npx eslint "src/**/*.{js,jsx,ts,tsx}" --max-warnings=0

    - name: Format check JS
      working-directory: frontend
      run: |
        echo "✨ Vérification du formatage JS..."
        npx prettier --check "src/**/*.{js,jsx,ts,tsx,json,css,md}"

    # Tests Backend
    - name: Run PyTest
      env:
        ENV: test
        DATABASE_URL: sqlite+aiosqlite:///./test.db
        COVID_DATA_URL: ${{ fromJson(secrets.ENV_MSPR).COVID_DATA_URL }}
        MPOX_KAGGLE_DATASET: ${{ fromJson(secrets.ENV_MSPR).MPOX_KAGGLE_DATASET }}
      run: |
        echo "🧪 Exécution des tests Python..."
        pytest --maxfail=1 --disable-warnings -q

    # Tests E2E avec Cypress
    - name: Build & start docker-compose
      env:
        COUNTRY: usa
        ENV: test
        POSTGRES_USER: ${{ fromJson(secrets.ENV_MSPR).POSTGRES_USER }}
        POSTGRES_PASSWORD: ${{ fromJson(secrets.ENV_MSPR).POSTGRES_PASSWORD }}
        POSTGRES_DB: ${{ fromJson(secrets.ENV_MSPR).POSTGRES_DB }}
        DATABASE_URL: ${{ fromJson(secrets.ENV_MSPR).DATABASE_URL }}
        COVID_DATA_URL: ${{ fromJson(secrets.ENV_MSPR).COVID_DATA_URL }}
        MPOX_KAGGLE_DATASET: ${{ fromJson(secrets.ENV_MSPR).MPOX_KAGGLE_DATASET }}
      run: |
        echo "🐳 Démarrage des conteneurs..."
        docker-compose up -d --build

    - name: Wait for backend
      run: |
        echo "⏳ Attente du backend..."
        for i in {1..10}; do
          if curl -sSf http://localhost:8080/api/health; then
            echo "✅ Backend prêt"
            break
          fi
          echo "⏳ Tentative $i/10"
          sleep 10
        done

    - name: Cypress run
      env:
        COUNTRY: usa
        ENV: test
        CYPRESS_BASE_URL: http://localhost:8080
      uses: cypress-io/github-action@v6
      with:
        working-directory: frontend
        browser: chrome
        start: ""
        wait-on: "http://localhost:8080/api/health"

    # Sauvegarde des artifacts Cypress en cas d'échec
    - name: Upload Cypress artifacts
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: cypress-artifacts
        path: |
          frontend/cypress/videos
          frontend/cypress/screenshots

    # Notification Discord
    - name: Discord notification
      if: always()
      env:
        DISCORD_WEBHOOK: ${{ fromJson(secrets.ENV_MSPR).DISCORD_WEBHOOK_URL }}
      run: |
        if [ "${{ job.status }}" == "success" ]; then
          curl -H "Content-Type: application/json" \
              -X POST \
              -d '{
                "embeds": [{
                  "title": "✅ Tests réussis",
                  "description": "Tous les tests sont passés ! 🎉",
                  "color": 3066993,
                  "fields": [
                    {"name": "Branch", "value": "${{ github.ref_name }}", "inline": true},
                    {"name": "Commit", "value": "`${{ github.sha }}`", "inline": true},
                    {"name": "Auteur", "value": "${{ github.actor }}", "inline": true}
                  ]
                }]
              }' \
              $DISCORD_WEBHOOK
        else
          curl -H "Content-Type: application/json" \
              -X POST \
              -d '{
                "embeds": [{
                  "title": "❌ Tests échoués",
                  "description": "Certains tests ont échoué 💥",
                  "color": 15158332,
                  "fields": [
                    {"name": "Branch", "value": "${{ github.ref_name }}", "inline": true},
                    {"name": "Commit", "value": "`${{ github.sha }}`", "inline": true},
                    {"name": "Auteur", "value": "${{ github.actor }}", "inline": true}
                  ]
                }]
              }' \
              $DISCORD_WEBHOOK
        fi