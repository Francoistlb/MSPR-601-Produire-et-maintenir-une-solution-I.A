name: CI - Tests & Build

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

jobs:
  build-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:14
        env:
          POSTGRES_USER: ${{ fromJson(secrets.ENV_MSPR).POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ fromJson(secrets.ENV_MSPR).POSTGRES_PASSWORD }}
          POSTGRES_DB: ${{ fromJson(secrets.ENV_MSPR).POSTGRES_DB }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run tests
        env:
          DATABASE_URL: ${{ fromJson(secrets.ENV_MSPR).DATABASE_URL }}
          COVID_DATA_URL: ${{ fromJson(secrets.ENV_MSPR).COVID_DATA_URL }}
          MPOX_KAGGLE_DATASET: ${{ fromJson(secrets.ENV_MSPR).MPOX_KAGGLE_DATASET }}
        run: |
          pytest --maxfail=1 --disable-warnings -q
