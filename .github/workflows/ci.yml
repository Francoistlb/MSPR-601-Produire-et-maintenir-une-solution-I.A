name: CI - Tests & Build

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

jobs:
  build-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:14
        env:
          POSTGRES_USER: ${{ fromJson(secrets.ENV_MSPR).POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ fromJson(secrets.ENV_MSPR).POSTGRES_PASSWORD }}
          POSTGRES_DB: ${{ fromJson(secrets.ENV_MSPR).POSTGRES_DB }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # ---------- PYTHON / Tests API ----------
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.12"

      - name: Install backend deps
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run pytest (SQLite in-memory)
        env:
          ENV: test
          DATABASE_URL: sqlite+aiosqlite:///./test.db
          COVID_DATA_URL: ${{ fromJson(secrets.ENV_MSPR).COVID_DATA_URL }}
          MPOX_KAGGLE_DATASET: ${{ fromJson(secrets.ENV_MSPR).MPOX_KAGGLE_DATASET }}
        run: |
          pytest --maxfail=1 --disable-warnings -q

      # ---------- NODE / Tests Cypress ----------
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend deps
        working-directory: frontend
        run: npm ci

      - name: Build and start docker-compose stack
        run: |
          docker-compose up -d --build    


      - name: Wait for frontend to be ready
        run: |
          for i in {1..30}; do
              if curl -sSf http://localhost:8080/health > /dev/null; then
                  echo "Backend OK"; break
              fi
              echo "⏳ attente du backend… ($i/30)"
              sleep 3
          done

      # Run Cypress headless
      - name: Cypress run
        uses: cypress-io/github-action@v6
        with:
          working-directory: frontend     
          start: ""                       
          wait-on: "http://localhost:8080"
          browser: chrome                  

      # Conserver les vidéos & screenshots en cas d’échec
      - name: Upload Cypress artifacts
        if: failure()     
        uses: actions/upload-artifact@v4
        with:
          name: cypress-artifacts
          path: |
            frontend/cypress/videos
            frontend/cypress/screenshots