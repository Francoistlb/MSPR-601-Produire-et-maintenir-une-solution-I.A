name: CI – Lint • Tests • E2E

on:
  push:       { branches: [main, develop] }
  pull_request:
    branches: [main, develop]

jobs:
  quality-test-e2e:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:14
        env:
          POSTGRES_USER:     ${{ fromJson(secrets.ENV_MSPR).POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ fromJson(secrets.ENV_MSPR).POSTGRES_PASSWORD }}
          POSTGRES_DB:       ${{ fromJson(secrets.ENV_MSPR).POSTGRES_DB }}
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s --health-timeout 5s --health-retries 5

    steps:
    - name: Checkout
      uses: actions/checkout@v4


    - name: Set up Python
      uses: actions/setup-python@v4
      with: { python-version: "3.12" }

    - name: Install backend deps
      run: |
        python -m pip install --upgrade pip
        pip install -r backend/requirements.txt

    - name: Run pytest (SQLite in-memory)
      env:
        ENV: test
        DATABASE_URL: sqlite+aiosqlite:///./test.db
        COVID_DATA_URL: ${{ fromJson(secrets.ENV_MSPR).COVID_DATA_URL }}
        MPOX_KAGGLE_DATASET: ${{ fromJson(secrets.ENV_MSPR).MPOX_KAGGLE_DATASET }}
      run: |
        pytest --maxfail=1 --disable-warnings -q


    - name: Discord notification
      if: always()
      env:
        DISCORD_WEBHOOK: ${{ fromJson(secrets.ENV_MSPR).DISCORD_WEBHOOK_URL }}
      run: |
          if [ "${{ job.status }}" == "success" ]; then
            curl -H "Content-Type: application/json" \
                -X POST \
                -d '{
                  "embeds": [{
                    "title": "✅ Build Success",
                    "description": "Tests passed successfully! 🎉",
                    "color": 3066993,
                    "fields": [
                      {"name": "Branch", "value": "${{ github.ref_name }}", "inline": true},
                      {"name": "Commit", "value": "`${{ github.sha }}`", "inline": true},
                      {"name": "Author", "value": "${{ github.actor }}", "inline": true}
                    ]
                  }]
                }' \
                $DISCORD_WEBHOOK
          else
            curl -H "Content-Type: application/json" \
                -X POST \
                -d '{
                  "embeds": [{
                    "title": "❌ Build Failed",
                    "description": "Tests failed! 💥",
                    "color": 15158332,
                    "fields": [
                      {"name": "Branch", "value": "${{ github.ref_name }}", "inline": true},
                      {"name": "Commit", "value": "`${{ github.sha }}`", "inline": true},
                      {"name": "Author", "value": "${{ github.actor }}", "inline": true}
                    ]
                  }]
                }' \
                $DISCORD_WEBHOOK
          fi

    # ---------- NODE / Tests Cypress ----------
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: "20"
        cache: "npm"
        cache-dependency-path: frontend/package-lock.json
    - name: Install Python lint deps
      run: |
        python -m pip install --upgrade pip
        pip install flake8 black

    - name: Lint (flake8)
      run: flake8 backend/  # ajuste le chemin si besoin

    - name: Format check (black)
      run: black --check backend/

    # ──────────────── ANALYSE DE CODE JS / REACT ────────────────
    - name: Set up Node
      uses: actions/setup-node@v4
      with:
        node-version: "20"
        cache: "npm"
        cache-dependency-path: frontend/package-lock.json

    - name: Install JS deps (avec eslint & prettier)
      working-directory: frontend
      run: |
        npm ci
        # si eslint / prettier ne sont pas déjà dans package.json :
        # npm install --save-dev eslint prettier

    - name: Lint JS (eslint)
      working-directory: frontend
      run: npx eslint "src/**/*.{js,jsx,ts,tsx}" --max-warnings=0

    - name: Format check JS (prettier)
      working-directory: frontend
      run: npx prettier --check "src/**/*.{js,jsx,ts,tsx,json,css,md}"

    # ──────────────── TESTS BACK-END (pytest) ────────────────
    - name: Install backend deps
      run: pip install -r backend/requirements.txt

    - name: Run PyTest
      env:
        ENV: test
        DATABASE_URL: sqlite+aiosqlite:///./test.db
        COVID_DATA_URL:     ${{ fromJson(secrets.ENV_MSPR).COVID_DATA_URL }}
        MPOX_KAGGLE_DATASET: ${{ fromJson(secrets.ENV_MSPR).MPOX_KAGGLE_DATASET }}
      run: pytest --maxfail=1 --disable-warnings -q

    # ──────────────── STACK DOCKER + TESTS CYPRESS ────────────────
    - name: Build & start docker-compose
      run: docker-compose up -d --build

    - name: Wait for backend to be ready
      run: |
        for i in {1..30}; do
          curl -sSf http://localhost:8080/health && break
          echo "⏳ backend pas prêt ($i/30)"; sleep 3
        done

    - name: Cypress run
      uses: cypress-io/github-action@v6
      with:
        working-directory: frontend
        browser: chrome
        start: ""               # serveur déjà lancé
        wait-on: "http://localhost:8080"

    - name: Upload Cypress artifacts (si échec)
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: cypress-artifacts
        path: |
          frontend/cypress/videos
          frontend/cypress/screenshots
